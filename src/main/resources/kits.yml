      - { material: IRON_PICKAXE, amount: 1, enchantments: { EFFICIENCY: 2 } }
      - { material: IRON_SHOVEL, amount: 1, enchantments: { EFFICIENCY: 2 } }
      - { material: COBBLESTONE, amount: 16 }
      - { material: BAKED_POTATO, amount: 16 }

  # 6. Enchant earlier than anyone. Cost only.
  enchanter:
    id: 6
    name: "&dEnchanter"
    icon: EXPERIENCE_BOTTLE
    description:
      - "&7A pile of XP and lapis"
      - "&7for an early enchanting table."
    cost: 550
    items:
      - { material: EXPERIENCE_BOTTLE, amount: 12 }
      - { material: LAPIS_LAZULI, amount: 12 }
      - { material: BOOKSHELF, amount: 4 }
      - { material: BAKED_POTATO, amount: 16 }

  # 7. Fast striker, permanent speed. Cost only.
  scout:
    id: 7
    name: "&bScout"
    icon: FEATHER
    description:
      - "&7Permanently faster."
      - "&7Run in, hit, run out."
    cost: 700
    effects:
      - { type: SPEED, amplifier: 0, duration: 0 }
    items:
      - { material: STONE_SWORD, amount: 1 }
      - { material: COOKED_SALMON, amount: 12 }

  # === Row 2: mid tier (stats + cost) ======================================
