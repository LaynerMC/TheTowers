    cost: 900
    items:
      - { material: COBBLESTONE, amount: 64 }
      - { material: OAK_PLANKS, amount: 32 }
      - { material: OAK_FENCE, amount: 16 }
      - { material: LADDER, amount: 16 }
      - { material: BAKED_POTATO, amount: 16 }

  # 9. A blizzard in your hands.
  frost:
    id: 9
    name: "&b&lFrost"
    icon: SNOWBALL
    description:
      - "&7A blizzard in your hands:"
      - "&7snowballs to push attackers off."
    requires: { points: 8 }
    cost: 1100
    items:
