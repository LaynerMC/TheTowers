# ==========================================================
#  TheTowers - kits (21 total, 3 rows of 7)
# ==========================================================
# Each player chooses their kit with the "Kits" item (the sword) of the
# waiting lobby, or with /tt kit ANYWHERE (main lobby included):
#   /tt kit            -> the selection menu
#   /tt kit <kit>      -> selects a kit by id (ex. /tt kit archer)
#   /tt kit buy <kit>  -> pays a priced kit with coins (Vault)
# The chosen kit is given at game start and on every respawn, in addition to
# the team's leather armor (config.yml, kit.team-armor). The choice is
# remembered from one game to the next (saved in stats.yml).
#
# A kit REVEALS (its real icon/name show in the menu) only when ALL of its
# requirements are met - INCLUDING the coin cost. Until then it shows as a red
# glass pane named "???" with only the requirements listed. A revealed kit is
# only ever SELECTED (free): the coin cost is paid ONCE, the first time the
# player buys it, never again.
#
# Requirements, all optional and combinable. The cost is always charged LAST:
# the player must first meet the stats (if any) and the level (if any), and
# only then - if they have the money - can they buy the kit:
#   requires    : { stat: N, ... } STATS ONLY (games, wins, losses, kills,
#                 deaths, points), ALL must be reached. NOT for coins.
#                 Example: requires: { wins: 3 }
#   level       : (optional) TheTowers level to reach. Checked natively -
#                 no PlaceholderAPI needed. 0/absent = no level gate.
#   cost        : (optional, canonical) coin cost of the kit, a top-level
#                 field parallel to `level`. Paid ONCE, the first time the
#                 player buys the kit (after stats + level are met). 0/absent
#                 = free. Legacy aliases still work: a top-level `price:`, or
#                 a leftover `coins:` entry inside `requires` (migrate to
#                 `cost:` - a warning is logged otherwise).
#   permission  : (optional) a permission for a rank-reserved kit.
#   conditions  : (optional) PlaceholderAPI comparisons, ALL must be true.
#                 Format: "%placeholder% OPERATOR value". Operators: == != >= <= > <.
#                 Without PlaceholderAPI, a kit with conditions stays locked.
#   items       : contents { material: NAME, amount: quantity,
#                 enchantments: { NAME: level } }. Modern or old enchantment
#                 names accepted (EFFICIENCY / DIG_SPEED, SHARPNESS /
#                 DAMAGE_ALL...). A piece of armor is worn directly, replacing
#                 the team's leather piece.
#   effects     : (optional) potion effects re-applied on every respawn:
#                 { type: SPEED, amplifier: 0, duration: seconds }.
#                 duration 0 = until the next respawn (kept while alive).
#
# PROGRESSION (left to right, top row to bottom row = weakest to strongest):
#   Row 1 (kits 1-7): 1 FREE starter + 2 stats-only + 4 cost-only
#   Row 2 (kits 8-14): stats + cost
#   Row 3 (kits 15-21): stats + level + cost (the strongest kits)
# Within the cost-bearing kits the price rises strictly (250 -> 6500); stat
# gates and level gates rise too, so later kits take days of play to reach.
# Prices are tuned against rewards.yml coin income (~300 coins for a strong
# game).
#
# Permission thetowers.kits.all (op by default): unlocks every kit.
# Admin grant: /tt givekit <kit|id> <player> pays the cost on a player's behalf.
# Reload with /tt reload.

default-kit: default

# Sound played when a player clicks a kit they cannot select yet (still locked,
# or they cannot afford the coin cost). Set "sound: none" to disable it.
#   sound  : an XSound enum name, case-insensitive (e.g. BLOCK_ANVIL_USE,
#            BLOCK_NOTE_BLOCK_BASS, UI_BUTTON_CLICK, ENTITY_VILLAGER_NO).
#   volume : 0.0-1.0, lower = quieter.
#   pitch  : 0.0-2.0.
# Default: a soft anvil strike (BLOCK_ANVIL_USE), quiet, at the lowest pitch.
locked-click-sound:
  sound: BLOCK_ANVIL_USE
  volume: 0.4
  pitch: 0.0

kits:
  # === Row 1: starter tier (1 free + 2 stats-only + 4 cost-only) ============
  # 1. Everyone's kit: free, no condition, always available.
  default:
    id: 1
    name: "&fStarter"
    icon: LEATHER_CHESTPLATE
    description:
      - "&7Everyone's kit."
      - "&7A reliable meal, nothing else."
    items:
      - { material: BAKED_POTATO, amount: 16 }

  # 2. Melee from the very first second. Stats only.
  fighter:
    id: 2
    name: "&cFighter"
    icon: IRON_SWORD
    description:
      - "&7An iron sword from the start."
    requires: { wins: 3 }
    items:
      - { material: IRON_SWORD, amount: 1 }
      - { material: BAKED_POTATO, amount: 16 }

  # 3. Harass the other tower from a distance. Stats only.
  archer:
    id: 3
    name: "&aArcher"
    icon: BOW
    description:
      - "&7A bow and arrows to annoy"
      - "&7defenders from your bridge."
    requires: { games: 6 }
    items:
      - { material: BOW, amount: 1 }
      - { material: ARROW, amount: 24 }
      - { material: BAKED_POTATO, amount: 16 }

  # 4. Build fast, build high. Cost only.
  builder:
    id: 4
    name: "&eBuilder"
    icon: OAK_PLANKS
    description:
      - "&7Wood and sandstone to bridge"
      - "&7toward the enemy tower."
    cost: 250
    items:
      - { material: OAK_PLANKS, amount: 48 }
      - { material: SANDSTONE, amount: 32 }
      - { material: WOODEN_AXE, amount: 1 }
      - { material: BAKED_POTATO, amount: 16 }

  # 5. Dig your own path. Cost only.
  miner:
    id: 5
    name: "&6Miner"
    icon: IRON_PICKAXE
    description:
      - "&7Efficient tools to dig"
      - "&7a shortcut through the map."
    cost: 400
