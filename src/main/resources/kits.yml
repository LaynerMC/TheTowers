    requires: { kills: 20 }
    cost: 2200
    effects:
      - { type: JUMP, amplifier: 1, duration: 0 }
    items:
      - { material: STONE_SWORD, amount: 1 }
      - { material: APPLE, amount: 12 }

  # 14. Fire everywhere.
  pyro:
    id: 14
    name: "&6Pyro"
    icon: FLINT_AND_STEEL
    description:
      - "&7Flint, lava and a bit of TNT:"
