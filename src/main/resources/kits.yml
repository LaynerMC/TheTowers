      - { material: IRON_SWORD, amount: 1, enchantments: { SHARPNESS: 1 } }
      - { material: BREAD, amount: 16 }

  # 18. Get in, kill, get out.
  assassin:
    id: 18
    name: "&5Assassin"
    icon: ENDER_PEARL
    description:
      - "&7A sharp sword and pearls"
      - "&7to cross the map in a blink."
    requires: { kills: 40 }
    level: 25
    cost: 4600
    items:
      - { material: IRON_SWORD, amount: 1, enchantments: { SHARPNESS: 2 } }
      - { material: ENDER_PEARL, amount: 2 }
      - { material: COOKED_BEEF, amount: 12 }

  # 19. Reach level 30 to claim the diamond edge.
  champion:
    id: 19
    name: "&b&lCHAMPION"
    icon: DIAMOND
    description:
      - "&7The champion kit:"
      - "&7diamond edge and pearls."
    requires: { wins: 20 }
    level: 30
    cost: 5200
