# ==========================================================
#  TheTowers - menus configuration
# ==========================================================
# Every inventory menu of the plugin is configured here EXCEPT the
# kit selection menu (kits.yml keeps its own contents/lore).
# Each menu is its own section below: team selection, stats,
# spectator players, the admin setup menu and the lobby hotbar
# items' display names.
#
# Edit this file and run /tt reload to apply. & color codes and
# %name% variables are replaced when the menu is opened.

# ==========================================================
#  Team selection menu
# ==========================================================
# Opened by the wool block of the waiting lobby. Each team is one
# wool block in its own color, with its players listed underneath.
team-menu:
  title: "&8Choose your team &7(%arena%)"
  players-line: "&7Players: &f%current%&7/&f%max%"
  empty-line: "%color%Nobody yet"
  member-line: "%color% %color%%player%"
  member-you-line: "%color% %color%%player% &e(you)"
  status-chosen: "&a- Your team"
  status-full: "&c- Full"
  status-click: "&e- Click to join"

# ==========================================================
#  Stats menu (/tt stats [player])
# ==========================================================
# Opened by /tt stats. Each stat is one item; the player's value
# replaces %value%. The target player's name replaces %name% in
# the title. Set an item's slot to -1 to hide it.
#
# Each item accepts:
#   material : modern or pre-1.13 name (IRON_SWORD, PAPER...)
#   slot     : 0 to (size-1)
#   name     : display name (& colors, %value%)
#   lore     : list of lore lines (& colors, %value%)
#
# Available stat ids (use them as the item key):
#   games, wins, losses, kills, deaths, points, kd,
#   blocks_placed, blocks_broken, max_kill_streak,
#   damage_dealt, damage_taken, coins
stats-menu:
  title: "&8Stats of &f%name%"
  size: 36
  items:
    games:
      material: PAPER
      slot: 10
      name: "&aGames: &f%value%"
      lore:
        - "&7Total games played"
    wins:
      material: GOLD_INGOT
      slot: 11
      name: "&aWins: &f%value%"
      lore:
        - "&7Games won"
    losses:
      material: IRON_INGOT
      slot: 12
      name: "&cLosses: &f%value%"
      lore:
        - "&7Games lost"
    kills:
      material: IRON_SWORD
      slot: 13
      name: "&aKills: &f%value%"
      lore:
        - "&7Total enemies killed"
    deaths:
      material: SKULL_ITEM
      slot: 14
      name: "&cDeaths: &f%value%"
      lore:
        - "&7Times you died"
    points:
      material: EMERALD
      slot: 15
      name: "&aPoints: &f%value%"
      lore:
        - "&7Points scored in enemy pools"
    kd:
      material: DIAMOND_SWORD
      slot: 16
      name: "&aK/D: &f%value%"
      lore:
        - "&7Kill/death ratio"
    blocks_placed:
      material: BRICK
      slot: 19
      name: "&aBlocks placed: &f%value%"
      lore:
        - "&7Blocks placed during games"
    blocks_broken:
      material: IRON_PICKAXE
      slot: 20
      name: "&aBlocks broken: &f%value%"
      lore:
        - "&7Blocks mined during games"
    max_kill_streak:
      material: BLAZE_ROD
      slot: 21
      name: "&aBest kill streak: &f%value%"
      lore:
        - "&7Your highest kill streak"
    damage_dealt:
      material: GOLD_SWORD
      slot: 22
      name: "&aDamage dealt: &f%value%"
      lore:
        - "&7Total damage dealt (hearts)"
    damage_taken:
      material: REDSTONE
      slot: 23
      name: "&cDamage taken: &f%value%"
      lore:
        - "&7Total damage received (hearts)"
    coins:
      material: GOLD_NUGGET
      slot: 25
      name: "&6Coins: &f%value%"
      lore:
        - "&7Your coin balance"

# ==========================================================
#  Spectator "players" menu
# ==========================================================
# Opened by the eye of ender while spectating: one head per
# participant, click to teleport to them.
spectator-menu:
  title: "&8Players"
  lore: "&7Click to teleport to them"

