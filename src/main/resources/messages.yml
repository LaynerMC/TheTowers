# ================= End of game summary =================
# SkyWars-style summary box, centered in chat right after the victory screen.
# One list entry = one line. Variables:
#   %teams%          the score of every team ("Red 7/10 - Blue 5/10")
#   %points_player% / %points%      the top scorer and their points
#   %kills_player% / %kills%        the top killer and their kills
#   %damage_player% / %damage%      the most damage dealt and its value (hearts)
summary.box:
  - "&8&m----------------------------------------"
  - "&6&lGAME SUMMARY"
  - " "
  - "%teams%"
  - " "
  - "&6Most kills: &f%kills_player% &7(&b%kills%&7)"
  - "&6Top scorer: &f%points_player% &7(&a%points% pts&7)"
  - "&6Most damage: &f%damage_player% &7(&c%damage% hearts&7)"
  - "&8&m----------------------------------------"
summary.nobody: "&8nobody"

