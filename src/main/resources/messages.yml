# ==========================================================
#  TheTowers - player messages (English, single file)
# ==========================================================
# Color codes with & ; %name% variables are replaced when displayed.
# A key missing from your server's copy falls back to the bundled one.
#
# Organized by category:
#   commands   - /tt command feedback
#   coins      - coins system (/tt coins, /coins)
#   tops       - leaderboard output formats (%thetowers_top_...%)
#   arena      - arena state messages (join/leave/countdown/end)
#   game       - in-game events (kill, death, point, streak, ...)
#   game-start - the centered start-of-game banner (moved from config.yml)
#   title      - on-screen titles (action bar / title / subtitle)
#   summary    - end-of-game summary box
#   team       - team names and team-choice feedback
#   kits       - kit selection messages (the kit MENU itself is in kits.yml)
#   spectator  - spectator gameplay messages (menu is in menus.yml)
#   sign       - join signs
#   placeholder- yes/no answers
#   join       - main-lobby join messages (server join / back from a game)
#
# Menu lore lines (team menu, stats menu, spectator menu, setup
# menu, lobby item names) live in menus.yml. Scoreboards in
# scoreboard.yml.

# ==========================================================
#  Main-lobby join messages
# ==========================================================
# Shown when a player enters the lobby world (server join, coming back
# from a game, or changing into the lobby world). Toggleable in config.yml
# (join-messages.default-enabled / vip-enabled). The VIP line is used for
# players who have thetowers.join.vip. Any PlaceholderAPI placeholder works
# (%player_name%, %luckperms_prefix%, %thetowers_coins%...).
join:
  default: "&7%player_name% &ejoined the lobby"
  vip: "%luckperms_prefix% &7%player_name% &ejoined the lobby"

