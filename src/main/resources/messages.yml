# ================= Game start banner =================
# Centered multi-line message shown in chat when a game starts.
# Moved out of config.yml. Supports & colors and the variables
# %arena%, %goal% (points to win) and %minutes% (maximum duration).
# An empty list (or enabled: false) shows nothing.
game-start:
  enabled: true
  centered: true
  message:
    - "&8&m----------------------------------------"
    - "&6&lTHE TOWERS"
    - "&eThe game has begun!"
    - "&7Jump into the enemy pool of the other team to score."
    - "&7First team to &f%goal% &epoints wins. &7Max: &f%minutes% min"
    - "&8&m----------------------------------------"

